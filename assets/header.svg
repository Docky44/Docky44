<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Simon Pierre — Développeur Back-End &amp; Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0234E"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
      .fade { opacity: 0; animation: in .8s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .9s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .typed { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(30) 1.2s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0) } }
      .node { fill: #111827; stroke: #4b5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity=".55"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>

  <!-- Texte -->
  <g class="sans">
    <text x="72" y="96" class="mono fade d1" font-size="16" fill="#9ca3af">// Nantes, France · Open to work</text>
    <text x="70" y="160" class="fade d2" font-size="58" font-weight="700" fill="#f9fafb">Simon Pierre</text>
    <text x="72" y="202" class="fade d3" font-size="24" font-weight="600" fill="url(#accent)">Développeur Back-End &amp; Full Stack</text>
    <g class="mono fade d4" font-size="17">
      <text x="72" y="254" fill="#E0234E">$</text>
      <text x="92" y="254" fill="#d1d5db" class="typed">nest start --prod  # API ready on :3000</text>
    </g>
  </g>

  <!-- Schéma d'architecture -->
  <g transform="translate(715 40)">
    <!-- liaisons (centrées sur les blocs) -->
    <g stroke="#374151" stroke-width="2" stroke-linecap="round">
      <line x1="120" y1="120" x2="190" y2="120"/>
      <line x1="310" y1="120" x2="380" y2="120"/>
      <line x1="250" y1="92" x2="250" y2="50"/>
      <line x1="250" y1="148" x2="250" y2="190"/>
    </g>
    <g fill="#4b5563">
      <circle cx="120" cy="120" r="3"/><circle cx="190" cy="120" r="3"/>
      <circle cx="310" cy="120" r="3"/><circle cx="380" cy="120" r="3"/>
      <circle cx="250" cy="92" r="3"/><circle cx="250" cy="50" r="3"/>
      <circle cx="250" cy="148" r="3"/><circle cx="250" cy="190" r="3"/>
    </g>

    <!-- paquets qui circulent -->
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="2s" repeatCount="indefinite" path="M120 120 H190"/></circle>
    <circle r="3.5" fill="#E0234E"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M310 120 H380"/></circle>
    <circle r="3.5" fill="#DC382D"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M250 92 V50"/></circle>
    <circle r="3.5" fill="#4169E1"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite" path="M250 148 V190"/></circle>

    <g class="mono" font-size="12" text-anchor="middle">
      <rect class="node" x="0" y="92" width="120" height="56" rx="12" style="stroke:#61DAFB"/>
      <text x="60" y="117" fill="#f9fafb" font-weight="700">Front</text>
      <text x="60" y="134" fill="#9ca3af">Next.js · React</text>

      <rect class="node" x="190" y="92" width="120" height="56" rx="12" style="stroke:#E0234E"/>
      <text x="250" y="117" fill="#f9fafb" font-weight="700">API</text>
      <text x="250" y="134" fill="#9ca3af">NestJS · TS</text>

      <rect class="node" x="380" y="98" width="90" height="44" rx="10"/>
      <text x="425" y="125" fill="#d1d5db">workers</text>

      <rect class="node" x="200" y="6" width="100" height="44" rx="10" style="stroke:#DC382D"/>
      <text x="250" y="33" fill="#d1d5db">Redis</text>

      <rect class="node" x="190" y="190" width="120" height="44" rx="10" style="stroke:#4169E1"/>
      <text x="250" y="217" fill="#d1d5db">PostgreSQL</text>
    </g>
  </g>
</svg>
